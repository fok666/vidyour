[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vidyour-backend"
version = "0.1.0"
description = "VidYour BPM-aware AI video composition backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "python-multipart==0.0.34",
    "httpx==0.28.1",
    "numpy==2.3.5",
    "scipy==1.17.1",
    "pillow==13.0.0",
    "google-genai==3.6.1",
    "boto3==1.44.9",
    "botocore[crt]==1.44.11",  # `aws login` profiles need the CRT credential provider
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --tb=short"
